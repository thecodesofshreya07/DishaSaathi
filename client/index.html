<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/brand-icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DishaSaathi — Municipal Bureaucracy Path Visualizer</title>
    <meta name="description" content="DishaSaathi turns fragmented government information into one clear, source-verified, dependency-aware civic roadmap." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
      /* Clean styling for Google Translate element so it integrates seamlessly without shifting layout */
      .goog-te-banner-frame.skiptranslate,
      .goog-te-banner-frame {
        display: none !important;
      }
      body {
        top: 0px !important;
      }
      #google_translate_element {
        position: absolute;
        bottom: 0;
        left: 0;
        opacity: 0;
        pointer-events: none;
        z-index: -999;
      }
      .goog-tooltip,
      .goog-tooltip:hover {
        display: none !important;
      }
      .goog-text-highlight {
        background-color: transparent !important;
        border: none !important;
        box-shadow: none !important;
      }
      #goog-gt-tt {
        display: none !important;
      }
    </style>
  </head>
  <body class="bg-[#F4F6F8] text-[#1E293B] antialiased selection:bg-blue-100 selection:text-blue-900">
    <div id="root"></div>

    <!-- Official Google Translate Integration Element -->
    <div id="google_translate_element"></div>
    <script type="text/javascript">
      function googleTranslateElementInit() {
        if (window.google && window.google.translate) {
          new window.google.translate.TranslateElement({
            pageLanguage: 'en',
            includedLanguages: 'en,hi,mr',
            layout: window.google.translate.TranslateElement.InlineLayout.SIMPLE,
            autoDisplay: false
          }, 'google_translate_element');
        }
      }
    </script>
    <script type="text/javascript" src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
